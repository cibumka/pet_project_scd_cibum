# Iceberg catalogs, backed by a JDBC (Postgres) catalog rather than the
# Hadoop catalog: Iceberg's HadoopCatalog.listNamespaces() (used by e.g.
# `SHOW DATABASES`, which dbt needs during every run) is broken against
# S3A/MinIO in this Iceberg version - reproducible even outside dbt via
# plain `SHOW DATABASES IN stg`. JDBC catalog avoids listing S3 entirely
# for metadata and is Iceberg's own recommended choice for object storage.
spark.sql.extensions                          org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

spark.sql.catalog.stg                         org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.stg.catalog-impl            org.apache.iceberg.jdbc.JdbcCatalog
spark.sql.catalog.stg.uri                     jdbc:postgresql://postgres:5432/iceberg_catalog
spark.sql.catalog.stg.jdbc.user               airflow
spark.sql.catalog.stg.jdbc.password           airflow
spark.sql.catalog.stg.jdbc.schema-version     V1
spark.sql.catalog.stg.warehouse               s3a://stg/

spark.sql.catalog.mart                        org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.mart.catalog-impl           org.apache.iceberg.jdbc.JdbcCatalog
spark.sql.catalog.mart.uri                    jdbc:postgresql://postgres:5432/iceberg_catalog
spark.sql.catalog.mart.jdbc.user              airflow
spark.sql.catalog.mart.jdbc.password          airflow
spark.sql.catalog.mart.jdbc.schema-version    V1
spark.sql.catalog.mart.warehouse              s3a://mart/

spark.sql.defaultCatalog                      mart

# S3A -> MinIO. Credentials come from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# env vars (set in docker-compose.yml from .env) rather than hardcoded here.
spark.hadoop.fs.s3a.endpoint                  http://minio:9000
spark.hadoop.fs.s3a.path.style.access         true
spark.hadoop.fs.s3a.connection.ssl.enabled    false
spark.hadoop.fs.s3a.impl                      org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider  com.amazonaws.auth.EnvironmentVariableCredentialsProvider

spark.master                                  local[*]
